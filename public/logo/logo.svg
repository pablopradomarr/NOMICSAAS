<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logotipo de CFOnomic (brand book `cfonomic-design`, §4).
  "CFO" en sans-serif black carbon + "nomic" en serif italic lima neon.
  Sin isotipo: el logo ES la tipografia.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="CFOnomic">
  <title>CFOnomic</title>
  <text x="0" y="68"
        font-family="'League Spartan', 'Inter', system-ui, sans-serif"
        font-weight="900" font-size="64" letter-spacing="-1.5" fill="#1A202C">CFO</text>
  <text x="152" y="68"
        font-family="'Playfair Display', Georgia, serif"
        font-style="italic" font-weight="400" font-size="64" fill="#EAFF69">nomic</text>
</svg>
