name: Fiabilidad

# ─────────────────────────────────────────────────────────────────────────────
# E12 · T22 — La capa de fiabilidad, comprobada por una máquina en cada push.
# (`docs/design/E12-fiabilidad-dod.md` §8)
#
# Workflow HERMANO de `ci.yml`, no su sustituto: `ci.yml` ya corre lint, unit,
# typecheck, docker, integración, fixtures de E10 y pureza del motor. Éste añade
# lo que hasta E12 **no corría nunca en CI** —aceptación C1–C7, el auditor
# automatizado y los e2e— y lo hace con las dos condiciones que hacen que los
# asertos signifiquen algo:
#
#   · `GIT_SHA` en TODOS los jobs. Sin él el sello sale `REQUIERE REVISIÓN` por
#     diseño (runbook de E3) y la mitad de los asertos serían falsos.
#   · `TZ: Europe/Madrid` en TODOS los jobs. La hidratación de fechas ya costó
#     dos incidentes.
#
# Y una regla que no se negocia (enmienda **E-9** de la v1.1):
# **`NO_VERIFICABLE` falla igual que `DISCREPANCIA`.** Lo impone el código de
# salida de `scripts/audit-reconstruct.ts`, que sólo devuelve 0 con `CONFORME`.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # El techo de 1,5 GB (criterio 47) tarda seis minutos y deja la base con
  # bloat: no puede correr en cada push, pero tampoco puede no correr nunca
  # (H-3). Va de noche, y se puede lanzar a mano.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiabilidad-${{ github.ref }}
  cancel-in-progress: true

env:
  # Las dos variables del §8, en la raíz: heredarlas es la única forma de que
  # NINGÚN job se quede sin ellas al añadir el siguiente.
  GIT_SHA: ${{ github.sha }}
  TZ: Europe/Madrid
  CI: "true"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1 · Lint + tsc
  # ───────────────────────────────────────────────────────────────────────────
  lint-tsc:
    name: 1 · Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  # ───────────────────────────────────────────────────────────────────────────
  # 2 · Unitarios
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: 2 · Unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test

  # ───────────────────────────────────────────────────────────────────────────
  # 3 · Integración (Postgres)
  # ───────────────────────────────────────────────────────────────────────────
  integracion:
    name: 3 · Integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/erp_test
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      BASE_URL: http://localhost:7331
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      PLATFORM_SIGNING_KEY: ci-platform-signing-key
      PLATFORM_SIGNING_KEY_ID: k1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - name: Credencial del rol de runtime
        run: ./scripts/dev-db-setup.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      - run: npm run test:integration

  # ───────────────────────────────────────────────────────────────────────────
  # 4 · RLS (rol `app_runtime`, NOBYPASSRLS)
  # ───────────────────────────────────────────────────────────────────────────
  rls:
    name: 4 · RLS con app_runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/erp_test
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      BETTER_AUTH_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - name: Credencial del rol de runtime
        run: ./scripts/dev-db-setup.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      # La suite de integración corre como PROPIETARIO, que ignora RLS. Ésta es
      # la única que demuestra que la segunda barrera filtra de verdad.
      - run: npm run test:integration:rls

  # ───────────────────────────────────────────────────────────────────────────
  # 5 · Aceptación C1–C7 + memoria borrada + reconstrucción desde backup
  # ───────────────────────────────────────────────────────────────────────────
  aceptacion:
    name: 5 · Aceptación C1–C7
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/erp_test
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      BASE_URL: http://localhost:7331
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      PLATFORM_SIGNING_KEY: ci-platform-signing-key
      PLATFORM_SIGNING_KEY_ID: k1
      STORAGE_BACKEND: local
      STORAGE_PREFIX: erp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - name: Credencial del rol de runtime
        run: ./scripts/dev-db-setup.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      # Los siete C1–C7 **más** «memoria borrada» (P4) y «reconstrucción desde
      # backup» (P7). Cada fichero deja su `artifacts/acceptance/<c>/validacion.json`.
      - run: npm run test:acceptance
      - name: Ninguna familia SIN_EVALUAR se cuela en verde
        # La regla de C5 vive en el propio test (criterio 22); aquí sólo se
        # comprueba que los validacion.json existen: un job que publica un
        # artefacto vacío y se declara verde es el adorno que E12 persigue.
        run: |
          set -e
          test -d artifacts/acceptance || { echo "::error::la suite no dejó artifacts/acceptance"; exit 1; }
          n=$(find artifacts/acceptance -name validacion.json | wc -l)
          echo "· $n validacion.json de aceptación"
          [ "$n" -ge 7 ] || { echo "::error::sólo $n componentes dejaron validacion.json (se esperan ≥ 7)"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aceptacion-validacion
          path: artifacts/acceptance/**/validacion.json
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # 6 · Auditor automatizado (Capa 2 de C4)
  # ───────────────────────────────────────────────────────────────────────────
  auditor-automatizado:
    name: 6 · Auditor automatizado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/erp_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      DATABASE_URL_MAINTENANCE: postgresql://postgres:postgres@localhost:5432/erp_test
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      PLATFORM_SIGNING_KEY: ci-platform-signing-key
      PLATFORM_SIGNING_KEY_ID: k1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - name: Credencial del rol de runtime
        run: ./scripts/dev-db-setup.sh
      - name: Esquema al día
        run: npx prisma migrate deploy
      # **BLOQUEA 2 / H-2** — el control que protege la independencia del
      # auditor (criterio 14, I-E12-2, cierre de G-14). Corre también en
      # `npm run test` (está en el `include` de `vitest.config.ts`); aquí va
      # además como paso propio y ANTES de usar el auditor, porque un auditor
      # que hubiera derivado hacia el motor no debe llegar ni a ejecutarse.
      - name: El auditor no importa nada del productor (AST)
        run: npx tsx scripts/audit-reconstruct.imports.test.ts
      # **Los informes se emiten ANTES del auditor**, y ése es el orden que
      # importa: sin cifras selladas el veredicto sería `NO_VERIFICABLE`, que
      # aquí falla igual que `DISCREPANCIA` (enmienda E-9).
      - name: Fixture cargado por el motor e informes sellados
        run: npx tsx scripts/ci-audit-fixture.ts --out artifacts/validacion.json
      - name: Reconstrucción independiente por SQL crudo
        # Código de salida ≠ 0 con DISCREPANCIA **y con NO_VERIFICABLE**.
        run: |
          npx tsx scripts/audit-reconstruct.ts \
            --org c1ac1ac1-0e12-4000-8000-000000000001 \
            --ref-date 2026-12-31 \
            --out artifacts/audit-reconstruct.json
      - name: Resumen en el PR
        if: always()
        run: npx tsx scripts/ci-resumen.ts --dir artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auditor-automatizado
          path: |
            artifacts/validacion.json
            artifacts/barrido.json
            artifacts/audit-reconstruct.json
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # 6-bis · Pureza del motor, EXTENDIDA (§8 del diseño · H-3 de la auditoría)
  #
  # `ci.yml` ya cubre ocho directorios de `lib/`. §8 exige además `lib/platform/**`
  # —el backup, el inventario derivado, las cuotas: todo lo que calcula una cifra
  # que el cliente ve— y el propio **auditor**, que es la Capa 2: si un día
  # importara el motor o llamara a un LLM, dejaría de refutar.
  # ───────────────────────────────────────────────────────────────────────────
  pureza-motor:
    name: 6-bis · Pureza del motor (+ lib/platform y el auditor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sin reloj, IO ni LLM en el motor contable ni en lib/platform
        run: |
          set -euo pipefail
          n=0
          for dir in lib/ledger lib/analytics lib/accounts lib/taxes lib/audit lib/bank \
                     lib/closing lib/recurring lib/budget lib/time lib/platform; do
            [ -d "$dir" ] || { echo "::error::$dir no existe: la lista de pureza se ha quedado atrás"; exit 1; }
            # Se descartan los comentarios (una línea que sólo NOMBRA `prisma`
            # no es una impureza) y los tipos del cliente generado
            # (`from "@/prisma/client"`), que desaparecen al compilar. Sin estos
            # dos filtros el guard salta en los once directorios —así estaba el
            # de `ci.yml`, que por eso no decía nada útil.
            if grep -rnE "Date\.now\(\)|new Date\(\s*\)|from \"@/lib/db\"|\bprisma\b|\bfetch\(|langchain|@langchain" \
                 --include="*.ts" "$dir" \
                 | grep -v "\.test\.ts:" \
                 | grep -vE ":[0-9]+: *(\*|//|/\*)" \
                 | grep -vE 'from "@/prisma/client"'; then
              echo "::error::Impureza detectada en $dir (reloj, IO, Prisma o LLM). Ver CLAUDE.md."
              exit 1
            fi
            echo "· $dir puro"
            n=$((n + 1))
          done
          [ "$n" -ge 11 ] || { echo "::error::sólo $n directorios comprobados"; exit 1; }
      - name: El auditor no toca el productor, ni la red, ni un LLM
        run: |
          set -euo pipefail
          # `new Date()` NO entra en esta lista a propósito: el auditor la usa
          # sólo para fechar su propio informe (`generadoEn`), nunca para
          # calcular — la fecha de referencia entra por `--ref-date`. Lo que aquí
          # se prohíbe es depender del productor, de la red o de un modelo.
          if grep -rnE "from \"@/(lib|models|ai|app)/|require\(\"@?/?(lib|models|ai|app)/|langchain|@langchain|\bfetch\(|Date\.now\(\)" \
               scripts/audit-reconstruct.ts \
               | grep -vE ":[0-9]+: *(\*|//|/\*)"; then
            echo "::error::el auditor ha dejado de ser independiente. Ver §13 del diseño de E12."
            exit 1
          fi
          echo "· scripts/audit-reconstruct.ts independiente"

  # ───────────────────────────────────────────────────────────────────────────
  # 6-ter · Rendimiento (§8 · techos 3, 5, 6 y 8 · criterio 47)
  #
  # Los techos baratos (`perf-audit`, `perf-budget`, `perf-closing`, `perf-pages`)
  # corren en cada push. El de **volumen real** —`perf-platform`, 50 000 asientos
  # y 1,5 GB de documentos, criterio 47— tarda seis minutos y deja la base con
  # bloat: va en el disparador NOCTURNO (`schedule`) o a mano, y no en cada push.
  # Hasta la ronda 1 no lo ejecutaba **ningún** job (H-3).
  # ───────────────────────────────────────────────────────────────────────────
  perf:
    name: 6-ter · Rendimiento${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && ' (+ volumen real, 1,5 GB)' || '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/erp_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      DATABASE_URL_MAINTENANCE: postgresql://postgres:postgres@localhost:5432/erp_test
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      PLATFORM_SIGNING_KEY: ci-platform-signing-key
      PLATFORM_SIGNING_KEY_ID: k1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - name: Credencial del rol de runtime
        run: ./scripts/dev-db-setup.sh
      - name: Esquema al día
        run: npx prisma migrate deploy
      # Los techos se miden sobre una base ANALIZADA: sin `ANALYZE`, el plan de
      # una tabla recién sembrada es el de una tabla vacía y el número que sale
      # no mide el código (DEBE #5 de la revisión).
      - name: Techos por página, presupuesto, cierre y auditoría
        run: |
          set -euo pipefail
          npx vitest run --config vitest.integration.config.ts \
            tests/integration/perf-audit.test.ts \
            tests/integration/perf-budget.test.ts \
            tests/integration/perf-closing.test.ts \
            tests/integration/perf-pages.test.ts
      - name: Volumen real (criterio 47) — sólo nocturno
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:perf

  # ───────────────────────────────────────────────────────────────────────────
  # 7 · Fixtures sellados: TODOS los generadores, con --check
  # ───────────────────────────────────────────────────────────────────────────
  fixtures-check:
    name: 7 · Fixtures sellados (--check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Un fixture sellado que ya no se puede REGENERAR deja de ser un contrato.
      # **Todos** los generadores, no una lista a mano: una lista a mano ha
      # fallado cuatro veces (BUG-E7-1, BUG-E9-5, BUG-E10-1, BUG-E11-2) y sería
      # además la enmienda E-4 incumplida en el propio control que la vigila.
      - name: Cada generador reproduce su fixture byte a byte
        run: |
          set -euo pipefail
          n=0
          for gen in docs/design/fixtures/build_*.py; do
            echo "── $gen"
            python3 "$gen" --check
            n=$((n + 1))
          done
          echo "· $n generadores comprobados"
          [ "$n" -ge 12 ] || { echo "::error::sólo $n generadores; ¿se ha perdido alguno?"; exit 1; }

  # ───────────────────────────────────────────────────────────────────────────
  # 8 · e2e, UN FICHERO POR JOB
  # ───────────────────────────────────────────────────────────────────────────
  # La matriz **se deriva del directorio** (PUEDE #12 de la revisión): una lista
  # a mano coincidía hoy con `tests/e2e/*.spec.ts`, pero un fichero nuevo no
  # correría y nadie lo notaría — la clase de fallo que la enmienda E-4 existe
  # para cerrar.
  e2e-matriz:
    name: 8 · e2e (matriz derivada del directorio)
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.listar.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: listar
        run: |
          set -euo pipefail
          specs=$(ls tests/e2e/*.spec.ts | xargs -n1 basename | sed 's/\.spec\.ts$//' | sort | jq -R . | jq -sc .)
          n=$(echo "$specs" | jq 'length')
          echo "· $n especificaciones: $specs"
          [ "$n" -ge 13 ] || { echo "::error::sólo $n specs de e2e; ¿se ha perdido alguno?"; exit 1; }
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  e2e:
    name: 8 · e2e ${{ matrix.spec }}
    runs-on: ubuntu-latest
    needs: e2e-matriz
    strategy:
      fail-fast: false
      # Por fichero, para que un fallo diga CUÁL sin leer 600 líneas de log.
      matrix:
        spec: ${{ fromJSON(needs.e2e-matriz.outputs.specs) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app_runtime:ci-app-runtime-password@localhost:5432/erp
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/erp
      DATABASE_URL_MAINTENANCE: postgresql://postgres:postgres@localhost:5432/erp
      AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      SELF_HOSTED_MODE: "true"
      DISABLE_SIGNUP: "false"
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      PLATFORM_SIGNING_KEY: ci-platform-signing-key
      PLATFORM_SIGNING_KEY_ID: k1
      STORAGE_BACKEND: local
      STORAGE_PREFIX: erp
      UPLOAD_PATH: ./data/uploads
      # ADR-0022: con la lista vacía NADIE es operador de plataforma y /admin
      # responde 404. El e2e de `/admin` necesita declarar al usuario del arnés.
      PLATFORM_ADMIN_EMAILS: taxhacker@localhost
      E2E_BASE_URL: http://localhost:7331
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Credencial del rol de runtime
        run: ./scripts/dev-db-setup.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp
      - name: Esquema al día
        run: npx prisma migrate deploy
      # El `webServer` de `playwright.config.ts` levanta `npm run dev` y lo
      # reutiliza si ya está: no hace falta arrancarlo aquí.
      - name: ${{ matrix.spec }}.spec.ts
        run: npx playwright test tests/e2e/${{ matrix.spec }}.spec.ts
      - uses: actions/upload-artifact@v7
        # Sólo si falla: un report de Playwright por cada spec en verde son 13
        # artefactos que nadie abre.
        if: failure()
        with:
          name: playwright-report-${{ matrix.spec }}
          path: |
            playwright-report/
            tests/e2e/.artifacts/
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # 9 · Build de producción
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 9 · Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/erp
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      PLATFORM_SIGNING_KEY: ci-platform-signing-key
      PLATFORM_SIGNING_KEY_ID: k1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
