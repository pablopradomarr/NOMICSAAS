name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      # El rol de migraciones y de los tests es el propietario; el test de humo
      # de RLS abre sus propias conexiones como `app_runtime` (ADR-0007).
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/erp_test
      APP_RUNTIME_PASSWORD: ci-app-runtime-password
      PGPASSWORD: postgres
      BASE_URL: http://localhost:7331
      BETTER_AUTH_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx prisma generate
      # Ronda 3 (A): la credencial de `app_runtime` va ANTES de la primera suite.
      # `test:integration` ya abre conexiones como ese rol (el humo de RLS de
      # lib/db.test.ts y e1-rls*.test.ts), así que darle contraseña después
      # dejaba esos tests fallando o conectando por casualidad.
      # Las migraciones las aplica el globalSetup de cada suite; este paso sólo
      # crea el rol y le pone credencial, así que no necesita el esquema.
      - name: Credencial del rol de runtime (las migraciones ya no fijan contraseñas)
        run: ./scripts/dev-db-setup.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      # Falla el job si DATABASE_URL_TEST no está: los tests de fuga entre
      # tenants y el de migración NO pueden saltarse en CI (#10).
      - run: npm run test:integration
      # Ronda 2 (#6): la suite anterior corre como PROPIETARIO, que ignora RLS.
      # Ésta ejecuta el código real de `models/` conectando como `app_runtime`
      # (NOBYPASSRLS): es la única que demuestra que la barrera 2 filtra.
      - run: npm run test:integration:rls

  pureza-motor:
    name: Guard de pureza (lib/ledger, lib/analytics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # CLAUDE.md: `lib/ledger/**` y `lib/analytics/**` son funciones PURAS.
      # Prohibido `new Date()` sin argumento, `Date.now()`, `prisma`, `fetch` y
      # cualquier LLM: la fecha de referencia entra por parámetro.
      - name: Sin reloj, IO ni LLM en el motor contable
        run: |
          set -e
          for dir in lib/ledger lib/analytics; do
            [ -d "$dir" ] || { echo "· $dir todavía no existe (E3/E4), se omite"; continue; }
            if grep -rnE "Date\.now\(\)|new Date\(\s*\)|from \"@/lib/db\"|\bprisma\b|\bfetch\(|langchain|@langchain" \
                 --include="*.ts" "$dir" | grep -v "\.test\.ts:"; then
              echo "::error::Impureza detectada en $dir (reloj, IO, Prisma o LLM). Ver CLAUDE.md."
              exit 1
            fi
            echo "· $dir puro"
          done
